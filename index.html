<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Grid Bistro Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .menu-item {
      background-color: #fff3cd;
      border: 1px solid #ffeeba;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    body {
      background-color: #f8f9fa;
    }
  </style>
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4">🍴 Welcome to The Grid Bistro</h2>

    <!-- Your menu layout goes here -->
    <!-- Appetizers -->
<div class="row">
    <div class="col-md-4 menu-item">Bruschetta</div>
    <div class="col-md-4 menu-item">Garlic Bread</div>
    <div class="col-md-4 menu-item">Stuffed Mushrooms</div>
  </div>
  
  <!-- Main Courses -->
  <div class="row">
    <div class="col-md-6 menu-item">Spaghetti Carbonara</div>
    <div class="col-md-6 menu-item">Grilled Salmon</div>
  </div>
  
  <!-- Desserts -->
  <div class="row">
    <div class="col menu-item">Tiramisu</div>
    <div class="col menu-item">Gelato</div>
    <div class="col menu-item">Cheesecake</div>
    <div class="col menu-item">Fruit Tart</div>
  </div>
  
  <!-- Combo Meal -->
  <div class="row">
    <div class="col-md-6">
      <div class="row">
        <div class="col-6 menu-item">Burger</div>
        <div class="col-6 menu-item">Fries</div>
      </div>
    </div>
    <div class="col-md-6 menu-item">Steak & Eggs</div>
  </div>
  
  </div>
</body>
</html>
